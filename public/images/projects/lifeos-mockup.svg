<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e18" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020810" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="650" cy="150" r="170" fill="#38bdf8" opacity="0.1" filter="blur(50px)" />
  <circle cx="150" cy="300" r="150" fill="#2563eb" opacity="0.1" filter="blur(50px)" />

  <!-- Window Header -->
  <rect x="40" y="35" width="720" height="42" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="65" cy="56" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="82" cy="56" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="99" cy="56" r="5" fill="#10b981" opacity="0.8" />
  <text x="125" y="61" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">LIFEOS.LOCAL // PERSONAL OPERATING SYSTEM &amp; SECOND BRAIN</text>
  
  <rect x="630" y="46" width="115" height="20" rx="4" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" />
  <text x="687" y="60" text-anchor="middle" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">+30 MODULES SYNC</text>

  <!-- Left: Unified Modules Grid -->
  <g transform="translate(40, 95)">
    <rect width="420" height="315" rx="12" fill="rgba(10,25,47,0.7)" stroke="rgba(255,255,255,0.08)" />
    
    <!-- 4 Module Badges -->
    <!-- Module 1: Second Brain -->
    <g transform="translate(20, 25)">
      <rect width="180" height="125" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(56,189,248,0.3)" />
      <text x="15" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">🧠 SECOND BRAIN</text>
      <text x="15" y="55" fill="#A3A3A3" font-family="sans-serif" font-size="11">Knowledge Base &amp; Notes</text>
      <text x="15" y="80" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">1,420 Nodes</text>
      <text x="15" y="105" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">● Real-time sync</text>
    </g>

    <!-- Module 2: Finance & Multi-Exchange -->
    <g transform="translate(220, 25)">
      <rect width="180" height="125" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(212,168,67,0.3)" />
      <text x="15" y="30" fill="#F5D785" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">📊 PORTFOLIO PARSER</text>
      <text x="15" y="55" fill="#A3A3A3" font-family="sans-serif" font-size="11">CSV Multi-exchanges</text>
      <text x="15" y="80" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">Unified Ledger</text>
      <text x="15" y="105" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">● DeFi + CeFi parsed</text>
    </g>

    <!-- Module 3: Automation Hub -->
    <g transform="translate(20, 165)">
      <rect width="180" height="125" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(168,85,247,0.3)" />
      <text x="15" y="30" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">⚙️ CELERY WORKERS</text>
      <text x="15" y="55" fill="#A3A3A3" font-family="sans-serif" font-size="11">Background Cron Tasks</text>
      <text x="15" y="80" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">12 Queues / 0 lag</text>
      <text x="15" y="105" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">● Redis Broker OK</text>
    </g>

    <!-- Module 4: Habit & Productivity -->
    <g transform="translate(220, 165)">
      <rect width="180" height="125" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(16,185,129,0.3)" />
      <text x="15" y="30" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">🎯 PRODUCTIVITY</text>
      <text x="15" y="55" fill="#A3A3A3" font-family="sans-serif" font-size="11">Daily Routines &amp; Focus</text>
      <text x="15" y="80" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">Streak: 184 days</text>
      <text x="15" y="105" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">● 100% Score</text>
    </g>
  </g>

  <!-- Right: Architecture Stack Details -->
  <g transform="translate(480, 95)">
    <rect width="280" height="315" rx="12" fill="rgba(10,25,47,0.7)" stroke="rgba(255,255,255,0.08)" />
    <text x="25" y="35" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">CORE ARCHITECTURE</text>

    <g transform="translate(25, 60)">
      <circle cx="10" cy="15" r="4" fill="#38bdf8" />
      <text x="25" y="19" fill="#F5F5F5" font-family="sans-serif" font-size="13" font-weight="bold">FastAPI &amp; Python 3.11</text>
      <text x="25" y="35" fill="#A3A3A3" font-family="sans-serif" font-size="11">High performance asynchronous backend</text>

      <circle cx="10" cy="70" r="4" fill="#60a5fa" />
      <text x="25" y="74" fill="#F5F5F5" font-family="sans-serif" font-size="13" font-weight="bold">React 18 &amp; TypeScript</text>
      <text x="25" y="90" fill="#A3A3A3" font-family="sans-serif" font-size="11">Modular dashboard with reactive state</text>

      <circle cx="10" cy="125" r="4" fill="#a855f7" />
      <text x="25" y="129" fill="#F5F5F5" font-family="sans-serif" font-size="13" font-weight="bold">PostgreSQL &amp; Redis Cache</text>
      <text x="25" y="145" fill="#A3A3A3" font-family="sans-serif" font-size="11">Relational integrity + sub-millisecond cache</text>

      <circle cx="10" cy="180" r="4" fill="#34d399" />
      <text x="25" y="184" fill="#F5F5F5" font-family="sans-serif" font-size="13" font-weight="bold">Docker Compose Orchestration</text>
      <text x="25" y="200" fill="#A3A3A3" font-family="sans-serif" font-size="11">Fully reproducible, portable deployment</text>
    </g>
  </g>
</svg>
